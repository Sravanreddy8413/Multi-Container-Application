services:
  app:
    build: .
    container_name: todo-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/todos
    depends_on:
      - mongo
    networks:
      - todo-network

  mongo:
    image: mongo:8
    container_name: todo-mongodb
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    networks:
      - todo-network

volumes:
  mongo-data:

networks:
  todo-network:
    driver: bridge
